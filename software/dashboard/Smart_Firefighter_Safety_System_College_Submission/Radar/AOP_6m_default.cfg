% ***************************************************************
% Texas Instruments IWR6843AOP mmWave Radar Configuration
% Application: 3D People Tracking & Human Proximity Detection
% Hardware: IWR6843AOPEVM (Antenna on Package, 60GHz - 64GHz)
% Nominal Detection Range: 0.1m - 6.0m (extended up to 10m)
% Azimuth Field-of-View: +/- 60 degrees
% Elevation Field-of-View: +/- 60 degrees
% Frame Rate: 20 Hz (50 ms frame duration)
% TLV Output: Point Cloud (1020), Target List (1010), Presence (1021)
% ***************************************************************

sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
lowPowerCfg 0

% Profile 0: 60 GHz start, 3.2 GHz chirp bandwidth, 256 ADC samples @ 6.4 Msps
profileCfg 0 60 100 7 40 0 0 100 1 256 6400 0 0 30

% Chirp Config for 3 TX Antennas (TDM-MIMO configuration for 3D elevation & azimuth)
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4

% Frame Config: 128 chirps per frame, 50ms periodicity (20 frames per second)
frameCfg 0 2 128 0 50 1 0

% CFAR Detection Parameters (Dynamic Range-Azimuth CFAR)
dynamicRACfarCfg -1 4 4 2 2 8 12 4 8 5.00 8.00 0.40 1 1
staticRangeAngleCfg -1 0 1 1

% Fine Motion & Vital Tracking
fineMotionCfg -1 1 3.0 10.0 0.5 0.5

% Extended Kalman Filter Tracking Engine (Tracking state count, gating, association)
trackingCfg 1 2 250 20 52 82 50 90

% GUI Output TLV Monitor Selection (Target List Enabled)
guiMonitor -1 1 1 0 0 0 1

% Start Radar Transmission
sensorStart
